apiVersion: security.kubearmor.com/v1
kind: KubeArmorPolicy
metadata:
  name: wisecow-zero-trust-policy
  namespace: wisecow
spec:
  selector:
    matchLabels:
      app: wisecow

  file:
    matchDirectories:
    - dir: /
      readOnly: true

  process:
    matchPaths:
    - path: /bin/sh
      action: Block